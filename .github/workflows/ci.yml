name: CI

# Test environment: every push to the working branches is tested, built and published
# to GitHub Pages, so the latest state is always available for review at the Pages URL.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Calendar logic (schedules, weeks from Monday, local dates) must not depend on the
      # device zone: the suite runs again in a zone west of UTC that used to have DST.
      - name: npm test (TZ=America/Sao_Paulo)
        run: npm test
        env:
          TZ: America/Sao_Paulo
      # The Mini App link the «Ссылка на навык» menu builds (optional repository variable
      # TG_APP_LINK, Settings → Secrets and variables → Actions → Variables); unset or empty,
      # the app uses its default https://t.me/SkillFlaskBot/app (src/platform/deeplink.ts).
      - run: npm run build
        env:
          VITE_TG_APP_LINK: ${{ vars.TG_APP_LINK }}
      - run: npm run check-bundle
      # The Vite manifest is only for check-bundle; it is not published with the app.
      - name: Drop the build manifest
        run: rm -rf dist/.vite
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Publishes the build to GitHub Pages — the HTTPS URL used for the Telegram Mini App.
  # Requires Settings → Pages → Source: "GitHub Actions". The github-pages environment only
  # accepts deployments from the repository's default branch unless its rules are relaxed.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
