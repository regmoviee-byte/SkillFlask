<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Альпинист — preview</title>
    <style>
      .pv {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      .pv-card {
        background: var(--color-bg-elevated);
        border-radius: var(--r-l);
        padding: 12px 16px;
      }
      .pv-title {
        margin: 0 0 8px;
        color: var(--color-fg-secondary);
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .pv-hero {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .pv-hero + .pv-hero {
        margin-top: 12px;
      }
      .pv-hero p {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .pv-hero .pv-hint {
        margin-top: 4px;
        font-size: 14px;
        font-weight: 500;
        color: var(--color-fg-secondary);
      }
      .pv-minis {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        flex-wrap: wrap;
      }
      .pv-minis figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--color-fg-secondary);
      }
      .pv-play {
        margin-top: 12px;
        padding: 10px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--color-accent);
        color: var(--color-on-accent);
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./climber.tsx"></script>
  </body>
</html>
