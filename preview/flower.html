<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Цветок — preview</title>
    <style>
      html {
        background: var(--tg-theme-secondary-bg-color, #f2f2f7);
      }
      .pv {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      .pv-card {
        background: var(--color-bg-elevated);
        border-radius: var(--r-l);
        padding: 12px 16px;
      }
      .pv-title {
        margin: 0 0 8px;
        color: var(--color-fg-secondary);
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .pv-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .pv-heroes {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pv-hero {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 16px;
      }
      .pv-hero p {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .pv-hero .hint {
        font-size: 14px;
        font-weight: 500;
        color: var(--color-fg-secondary);
      }
      .pv-minis {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .pv-minis figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--color-fg-secondary);
      }
      .pv-species {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      .pv-species figure,
      .pv-garden figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 12px;
        color: var(--color-fg-secondary);
      }
      .pv-species figcaption {
        font-size: 11px;
        white-space: nowrap;
      }
      /* The species on their own: the garden is hidden in this row only. */
      .pv-zoom {
        zoom: 0.55;
      }
      .pv-zoom .flower-garden {
        display: none;
      }
      .pv-species + .pv-minis {
        margin-top: 12px;
      }
      #species-minis {
        gap: 10px 14px;
      }
      #species-minis figure {
        flex-direction: row;
        align-items: flex-end;
      }
      .pv-garden {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px 8px;
      }
      .pv button.pv-play {
        padding: 10px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--color-accent);
        color: var(--color-on-accent);
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./flower.tsx"></script>
  </body>
</html>
