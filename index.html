<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- One per colour scheme so the browser chrome matches before applyTheme() runs. -->
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Skill Flask</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Painted before any stylesheet or script loads, so a dark theme never flashes white. -->
    <style>
      html {
        background: var(--tg-theme-secondary-bg-color, #f2f2f7);
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: var(--tg-theme-secondary-bg-color, #000);
        }
      }
    </style>
    <script>
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>
    <!-- Telegram Mini App API; harmless when opened in a regular browser. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Bottom sheets are portalled here so `inert` on #root leaves them interactive. -->
    <div id="sheets"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
